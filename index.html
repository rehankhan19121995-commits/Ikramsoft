<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Ledger Pro</title>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><link rel="stylesheet" href="style.css?v=2.3"></head>
<body>
<div id="gate"></div>
<div id="app" style="display:none">
 <aside>
  <div class="brand"><b>STEEL LEDGER PRO</b><small>Customer Accounts &amp; Billing</small></div>
  <div id="nav"></div>
  <div class="foot" id="foot"></div>
 </aside>
 <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="printRoot"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ helpers ============ */
const KEY='steelLedgerPro_v1';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(n)?0:n};
const money=n=>Math.round(n).toLocaleString('en-US');
const qtyf=n=>(+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:3});
const short=n=>n>=1e7?(n/1e7).toFixed(2)+' Cr':n>=1e5?(n/1e5).toFixed(1)+' L':money(n);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const fd8=iso=>{if(!iso)return '';const p=iso.split('-');return p.length<3?iso:p[2]+'-'+MON[+p[1]-1]+'-'+p[0]};
const bi=(en,ur)=>'<span>'+en+'</span> <span class="ur">'+ur+'</span>';
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const csvq=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
let memoryOnly=false;

/* ============ data ============ */
function seed(){
 return {v:1,meta:{seq:1,nextCust:1,nextEnt:1,nextInv:1,lastBackup:null},
  settings:{name:'Your Business Name',nameUr:'',address:'',phone:'',bank:'',invPrefix:'INV-'},
  customers:[],grades:[],rates:[],entries:[]};
}
function migrate(d){d.purchases=d.purchases||[];d.quotes=d.quotes||[];d.log=d.log||[];d.gradeMin=d.gradeMin||{};d.meta=d.meta||{};['nextPur','nextQuote'].forEach(k=>{d.meta[k]=d.meta[k]||1});d.customers.forEach(c=>{if(c.limit==null)c.limit=0;if(c.days==null)c.days=30});return d}
function load(){
 try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.customers)&&Array.isArray(d.entries))return migrate(d);}}
 catch(e){memoryOnly=true}
 return migrate(seed());
}
let DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){memoryOnly=true}}
save();

const cust=id=>DB.customers.find(c=>c.id===id);
const entriesOf=id=>DB.entries.filter(e=>e.cid===id).sort((a,b)=>a.seq-b.seq);
function ledger(cid){
 const c=cust(cid);let bal=num(c&&c.opening);
 return entriesOf(cid).map(e=>{bal+=e.type==='supply'?e.amount:-e.amount;return Object.assign({},e,{bal})});
}
function balanceOf(cid){const l=ledger(cid);return l.length?l[l.length-1].bal:num(cust(cid).opening)}
const balHtml=b=>b>0?'<span class="cr">'+money(b)+' CR</span>':b<0?'<span class="dr">'+money(-b)+' DR</span>':'<span>0</span>';
const invNo=n=>DB.settings.invPrefix+String(n).padStart(4,'0');
function rateFor(grade,date){
 const h=DB.rates.filter(r=>r.grade.toLowerCase()===String(grade).trim().toLowerCase()&&r.from<=date).sort((a,b)=>b.from.localeCompare(a.from));
 return h.length?h[0].rate:null;
}
function nextSerial(cid){
 const s=DB.entries.filter(e=>e.cid===cid&&e.type==='supply').map(e=>+e.serial||0);
 return Math.max(0,...s)+1;
}

/* ============ alerts (missing numbers etc.) ============ */
function alerts(){
 const a=[];
 DB.customers.forEach(c=>{
  const sup=DB.entries.filter(e=>e.cid===c.id&&e.type==='supply');
  const ser=sup.map(e=>+e.serial).filter(Boolean);
  const mx=Math.max(0,...ser);
  for(let i=1;i<=mx;i++){if(!ser.includes(i))a.push({bad:1,cid:c.id,msg:'<b>'+esc(c.name)+'</b>: serial no. '+i+' is MISSING'})}
  const seen={};ser.forEach(s=>{seen[s]=(seen[s]||0)+1});
  Object.keys(seen).forEach(s=>{if(seen[s]>1)a.push({bad:1,cid:c.id,msg:'<b>'+esc(c.name)+'</b>: serial no. '+s+' is used '+seen[s]+' times'})});
 });
 const inv=DB.entries.filter(e=>e.type==='supply').map(e=>+e.invoice).filter(Boolean);
 const im=Math.max(0,...inv);
 for(let i=1;i<=im;i++){if(!inv.includes(i))a.push({bad:1,msg:'Invoice no. <b>'+invNo(i)+'</b> is MISSING (an entry was deleted)'})}
 DB.entries.filter(e=>e.type==='payment'&&e.mode==='Cheque'&&!e.ref).forEach(e=>{const c=cust(e.cid);a.push({cid:e.cid,msg:'<b>'+esc(c?c.name:'?')+'</b>: cheque of '+money(e.amount)+' ('+fd8(e.date)+') has no reference no.'})});
 DB.entries.filter(e=>e.type==='supply'&&!(e.rate>0)).forEach(e=>{const c=cust(e.cid);a.push({cid:e.cid,msg:'<b>'+esc(c?c.name:'?')+'</b>: serial '+e.serial+' has no rate'})});
 DB.customers.forEach(c=>{const b=balanceOf(c.id);if(num(c.limit)>0&&b>num(c.limit))a.push({bad:1,cid:c.id,msg:'<b>'+esc(c.name)+'</b>: CREDIT LIMIT exceeded — balance '+money(b)+' vs limit '+money(c.limit)});const ov=ageing(c.id).overdue;if(ov>0)a.push({cid:c.id,msg:'<b>'+esc(c.name)+'</b>: '+money(ov)+' is overdue (older than '+(num(c.days)||30)+' days)'})});
 DB.grades.forEach(g=>{const s=stockInfo(g),mn=num(DB.gradeMin[g]);if(s.tracked&&s.stock<0)a.push({bad:1,msg:'Stock of <b>'+esc(g)+'</b> is negative ('+qtyf(s.stock)+' MT) — more delivered than purchased'});else if(s.tracked&&mn>0&&s.stock<=mn)a.push({msg:'Low stock: <b>'+esc(g)+'</b> has '+qtyf(s.stock)+' MT left (alert level '+qtyf(mn)+')'})});
 return a;
}

/* ============ UI shell ============ */
let view={name:'dashboard',cid:null};
const NAVA=['admin','Admin Panel','ایڈمن'];
const NAV=[['dashboard','Dashboard','ڈیش بورڈ'],['customers','Customers','گاہک'],['rates','Steel Rates','ریٹ'],['quotes','Quotations','کوٹیشن'],['stock','Stock & Heat No.','اسٹاک'],['billing','Billing','بلنگ'],['settings','Settings & Backup','سیٹنگز']];
function nav(name,cid){view={name:name,cid:cid||null};render();window.scrollTo(0,0)}
function render(){
 {const b=view.name==='customer'?'customers':view.name;if(b==='admin'?!isAdmin():!can(b)){const a=NAV.find(n=>can(n[0]));view={name:a?a[0]:'none',cid:null}}}
 $('#nav').innerHTML=NAV.filter(n=>can(n[0])).concat(isAdmin()?[NAVA]:[]).map(n=>'<a class="'+((view.name===n[0]||(view.name==='customer'&&n[0]==='customers'))?'on':'')+'" onclick="nav(\''+n[0]+'\')"><span>'+n[1]+'</span><span class="ur">'+n[2]+'</span></a>').join('');
 $('#foot').innerHTML=(memoryOnly?'Data NOT being saved!':'Saved in this browser')+(ME?'<div class="who"><span>'+esc(ME.name)+'</span><button class="btn sm ghost" onclick="logout()">Lock</button></div>':'');
 const f={dashboard:viewDashboard,customers:viewCustomers,customer:viewCustomer,rates:viewRates,quotes:viewQuotes,stock:viewStock,billing:viewBilling,settings:viewSettings,admin:viewAdmin}[view.name]||(()=>'<div class="card">Your account has no sections yet. Ask the admin to give you access.</div>');
 let banner='';
 if(memoryOnly)banner='<div class="banner">This browser is blocking storage, so your data will be lost when you close the page. Use Settings → Backup often, or open the file in Chrome / Edge.</div>';
 else{const lb=DB.meta.lastBackup,days=lb?(Date.now()-new Date(lb))/864e5:999;
  if(days>7)banner='<div class="banner y">Backup reminder: '+(lb?'last backup was '+Math.floor(days)+' days ago.':'you have never made a backup.')+' <a href="#" onclick="nav(\'settings\');return false">Make a backup now</a> (your data lives only in this browser).</div>'}
 $('#main').innerHTML=banner+f();
}
function head(en,ur,sub){return '<h1>'+en+' <span class="ur">'+ur+'</span></h1><div class="sub">'+(sub||'')+'</div>'}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}

/* ============ Dashboard ============ */
function viewDashboard(){
 const ym=today().slice(0,7);
 const sup=DB.entries.filter(e=>e.type==='supply'),pay=DB.entries.filter(e=>e.type==='payment');
 const bals=DB.customers.map(c=>({c:c,b:balanceOf(c.id)}));
 const due=sum(bals.filter(x=>x.b>0),x=>x.b), adv=sum(bals.filter(x=>x.b<0),x=>-x.b);
 const ms=sup.filter(e=>(e.date||'').startsWith(ym)),mp=pay.filter(e=>(e.date||'').startsWith(ym));
 const top=bals.filter(x=>x.b>0).sort((a,b)=>b.b-a.b).slice(0,6),mx=top.length?top[0].b:1;
 const al=alerts(),ag=ageingAll(),pf=profit(ym);
 const grades={};sup.forEach(e=>{const g=e.grade||'?';grades[g]=grades[g]||{all:0,m:0,amt:0};grades[g].all+=e.qty;grades[g].amt+=e.amount;if((e.date||'').startsWith(ym))grades[g].m+=e.qty});
 const recent=DB.entries.slice().sort((a,b)=>b.seq-a.seq).slice(0,8);
 return head('Dashboard','ڈیش بورڈ','Overview of all customers — '+fd8(today()))+
 '<div class="grid kpis">'+
 kpi('Customers',DB.customers.length,'registered accounts','')+
 kpi('Total Outstanding',money(due)+' CR','customers owe you','red')+
 kpi('Overdue',money(ag.overdue)+' CR','older than credit days','red')+
 kpi('Supplied This Month',money(sum(ms,e=>e.amount))+' CR',qtyf(sum(ms,e=>e.qty))+' MT','red')+
 kpi('Received This Month',money(sum(mp,e=>e.amount))+' DR',mp.length+' payment(s)','green')+
 kpi('Total Steel Sold',qtyf(sum(sup,e=>e.qty))+' MT',sup.length+' deliveries','gold')+
 (pf.known?kpi('Est. Profit This Month',money(pf.p),'sale − avg purchase cost',pf.p>=0?'green':'red'):'')+
 (adv>0?kpi('Advance Held',money(adv)+' DR','paid in advance','green'):'')+
 '</div>'+
 '<div class="grid two">'+
 '<div class="card"><h2>'+bi('Supplied vs Received — last 6 months','مال اور وصولی')+'</h2>'+chart()+'</div>'+
 '<div class="card"><h2>'+bi('Top Outstanding Customers','سب سے زیادہ بقایا')+'</h2>'+
  (top.length?top.map(x=>'<div class="hb"><div class="nm"><a href="#" onclick="nav(\'customer\',\''+x.c.id+'\');return false">'+esc(x.c.name)+'</a></div><div class="tr"><div class="fl" style="width:'+Math.max(2,x.b/mx*100)+'%"></div></div><div class="vv cr">'+short(x.b)+'</div></div>').join(''):'<div class="ok">No outstanding balances.</div>')+'</div>'+
 '</div>'+
 '<div class="grid two">'+
 '<div class="card"><h2>'+bi('Alerts','انتباہ')+'</h2>'+(al.length?al.slice(0,12).map(a=>'<div class="alert '+(a.bad?'bad':'')+'">'+a.msg+(a.cid?' <a href="#" onclick="nav(\'customer\',\''+a.cid+'\');return false">open</a>':'')+'</div>').join('')+(al.length>12?'<div class="sub">+ '+(al.length-12)+' more</div>':''):'<div class="ok">✔ No missing serial / invoice numbers. Everything looks fine.</div>')+'</div>'+
 '<div class="card"><h2>'+bi('Steel by Grade','گریڈ کے مطابق')+'</h2><div class="tw"><table><thead><tr><th>Grade</th><th>This Month (MT)</th><th>All Time (MT)</th><th>Amount</th></tr></thead><tbody>'+
  (Object.keys(grades).length?Object.keys(grades).map(g=>'<tr><td>'+esc(g)+'</td><td class="n">'+qtyf(grades[g].m)+'</td><td class="n">'+qtyf(grades[g].all)+'</td><td class="n">'+money(grades[g].amt)+'</td></tr>').join(''):'<tr><td colspan="4" class="c">No deliveries yet</td></tr>')+'</tbody></table></div></div>'+
 '</div>'+
 '<div class="card"><h2>'+bi('Receivables Ageing','بقایا جات کی عمر')+' <button class="btn sm ghost" onclick="printAgeing()">Print</button></h2><div class="tw"><table><thead><tr><th>0–30 days</th><th>31–60 days</th><th>61–90 days</th><th>Over 90 days</th><th>Opening balances</th><th>Total outstanding</th></tr></thead><tbody><tr>'+[ag.b0,ag.b1,ag.b2,ag.b3,ag.open].map(v=>'<td class="n">'+(v?money(v):'-')+'</td>').join('')+'<td class="n"><b>'+money(ag.total)+'</b></td></tr></tbody></table></div><div class="hint">Payments are applied to the oldest invoices first. Opening balances count as overdue.</div></div>'+
 '<div class="card"><h2>'+bi('Recent Activity','حالیہ اندراجات')+'</h2><div class="tw"><table><thead><tr><th>Date</th><th>Customer</th><th>Details</th><th>Credit (CR)</th><th>Debit (DR)</th></tr></thead><tbody>'+
 (recent.length?recent.map(e=>{const c=cust(e.cid);return '<tr class="link" onclick="nav(\'customer\',\''+e.cid+'\')"><td>'+fd8(e.date)+'</td><td>'+esc(c?c.name:'?')+'</td><td>'+(e.type==='supply'?esc(e.grade)+' · '+qtyf(e.qty)+' MT @ '+money(e.rate):esc(e.mode)+(e.bank?' · '+esc(e.bank):''))+'</td>'+(e.type==='supply'?'<td class="crc">'+money(e.amount)+' CR</td><td></td>':'<td></td><td class="drc">'+money(e.amount)+' DR</td>')+'</tr>'}).join(''):'<tr><td colspan="5" class="c">No entries yet</td></tr>')+'</tbody></table></div></div>';
}
function kpi(l,v,s,c){return '<div class="kpi '+c+'"><div class="l">'+l+'</div><div class="v '+(c==='red'?'cr':c==='green'?'dr':'')+'" style="'+(c?'':'')+'">'+v+'</div><div class="s">'+s+'</div></div>'}
function chart(){
 const now=new Date(),ms=[];
 for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push([d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),MON[d.getMonth()]])}
 const S=ms.map(m=>sum(DB.entries.filter(e=>e.type==='supply'&&(e.date||'').startsWith(m[0])),e=>e.amount));
 const P=ms.map(m=>sum(DB.entries.filter(e=>e.type==='payment'&&(e.date||'').startsWith(m[0])),e=>e.amount));
 const mx=Math.max(1,...S,...P),H=170,base=200;
 let s='<svg viewBox="0 0 620 235" style="width:100%;height:auto" font-family="Arial">';
 for(let g=0;g<=4;g++){const y=base-g*H/4;s+='<line x1="45" x2="610" y1="'+y+'" y2="'+y+'" stroke="#E2E8F2"/><text x="40" y="'+(y+4)+'" font-size="10" fill="#5d6b82" text-anchor="end">'+short(mx*g/4)+'</text>'}
 ms.forEach((m,i)=>{
  const x=60+i*92,hs=S[i]/mx*H,hp=P[i]/mx*H;
  s+='<rect x="'+x+'" y="'+(base-hs)+'" width="30" height="'+hs+'" fill="#C00000" rx="3"><title>Supplied '+money(S[i])+'</title></rect>';
  s+='<rect x="'+(x+34)+'" y="'+(base-hp)+'" width="30" height="'+hp+'" fill="#1E7B34" rx="3"><title>Received '+money(P[i])+'</title></rect>';
  s+='<text x="'+(x+32)+'" y="'+(base+16)+'" font-size="11" fill="#1b2433" text-anchor="middle">'+m[1]+'</text>';
  if(S[i])s+='<text x="'+(x+15)+'" y="'+(base-hs-4)+'" font-size="9" fill="#C00000" text-anchor="middle">'+short(S[i])+'</text>';
  if(P[i])s+='<text x="'+(x+49)+'" y="'+(base-hp-4)+'" font-size="9" fill="#1E7B34" text-anchor="middle">'+short(P[i])+'</text>';
 });
 s+='<rect x="60" y="222" width="10" height="10" fill="#C00000"/><text x="75" y="231" font-size="11">Steel supplied (CR)</text><rect x="200" y="222" width="10" height="10" fill="#1E7B34"/><text x="215" y="231" font-size="11">Payment received (DR)</text></svg>';
 return s;
}

/* ============ Customers ============ */
function viewCustomers(){
 const rows=DB.customers.map(c=>{const l=ledger(c.id),b=l.length?l[l.length-1].bal:num(c.opening);
  return {c:c,b:b,cr:sum(l.filter(e=>e.type==='supply'),e=>e.amount),dr:sum(l.filter(e=>e.type==='payment'),e=>e.amount),mt:sum(l.filter(e=>e.type==='supply'),e=>e.qty),last:l.length?l[l.length-1].date:'',ov:ageing(c.id).overdue}}).sort((a,b)=>b.b-a.b);
 return head('Customers','گاہک','Click a customer to open their separate account sheet')+
 '<div class="bar"><input id="cs" placeholder="Search customer…" oninput="filt(\'cs\',\'#ctab tbody tr\')"><span class="sp"></span><button class="btn" onclick="modalCustomer()">+ Add Customer</button></div>'+
 '<div class="card tw"><table id="ctab"><thead><tr><th>#</th><th>Customer</th><th>City</th><th>Phone</th><th>Steel Sold (MT)</th><th>Total Credit (CR)</th><th>Total Received (DR)</th><th>Balance</th><th>Credit Limit</th><th>Overdue</th><th>Last Entry</th></tr></thead><tbody>'+
 (rows.length?rows.map((r,i)=>'<tr class="link" data-s="'+esc((r.c.name+' '+r.c.city+' '+r.c.phone).toLowerCase())+'" onclick="nav(\'customer\',\''+r.c.id+'\')"><td class="c">'+(i+1)+'</td><td><b>'+esc(r.c.name)+'</b></td><td>'+esc(r.c.city)+'</td><td>'+esc(r.c.phone)+'</td><td class="n">'+qtyf(r.mt)+'</td><td class="n cr">'+money(r.cr)+'</td><td class="n dr">'+money(r.dr)+'</td><td class="n">'+balHtml(r.b)+'</td><td class="n">'+(num(r.c.limit)>0?(r.b>num(r.c.limit)?'<span class="cr">'+money(r.c.limit)+' ⚠</span>':money(r.c.limit)):'—')+'</td><td class="n">'+(r.ov>0?'<span class="cr">'+money(r.ov)+'</span>':'—')+'</td><td class="c">'+fd8(r.last)+'</td></tr>').join(''):'<tr><td colspan="11" class="c">No customers yet. Click “Add Customer”.</td></tr>')+
 '</tbody><tfoot><tr><td colspan="5">TOTAL ('+rows.length+' customers)</td><td class="n">'+money(sum(rows,r=>r.cr))+'</td><td class="n">'+money(sum(rows,r=>r.dr))+'</td><td class="n">'+money(sum(rows,r=>r.b))+'</td><td></td><td class="n">'+money(sum(rows,r=>r.ov))+'</td><td></td></tr></tfoot></table></div>';
}
function filt(inputId,sel){const q=$('#'+inputId).value.toLowerCase();document.querySelectorAll(sel).forEach(r=>{r.style.display=(r.dataset.s||'').includes(q)?'':'none'})}

function viewCustomer(){
 const c=cust(view.cid);if(!c){view={name:'customers'};return viewCustomers()}
 const l=ledger(c.id),b=l.length?l[l.length-1].bal:num(c.opening);
 const cr=sum(l.filter(e=>e.type==='supply'),e=>e.amount),dr=sum(l.filter(e=>e.type==='payment'),e=>e.amount);
 const al=alerts().filter(a=>a.cid===c.id);
 return '<div class="bar"><a href="#" onclick="nav(\'customers\');return false">← All Customers</a></div>'+
 '<h1>'+esc(c.name)+'</h1><div class="sub">'+esc([c.city,c.phone].filter(Boolean).join(' · '))+(c.notes?' — '+esc(c.notes):'')+' · Credit limit: <b>'+(num(c.limit)>0?money(c.limit):'none')+'</b> · Credit days: <b>'+(num(c.days)||30)+'</b></div>'+
 '<div class="grid kpis">'+kpi('Opening Balance',balHtml(num(c.opening)),'','')+kpi('Steel Supplied (CR)',money(cr)+' CR',qtyf(sum(l.filter(e=>e.type==='supply'),e=>e.qty))+' MT','red')+kpi('Received (DR)',money(dr)+' DR',l.filter(e=>e.type==='payment').length+' payment(s)','green')+kpi('Balance Due',b>0?money(b)+' CR':b<0?money(-b)+' DR':'0',b>0?'customer owes you':b<0?'paid in advance':'settled',b>0?'red':b<0?'green':'')+'</div>'+
 al.map(a=>'<div class="alert '+(a.bad?'bad':'')+'">'+a.msg+'</div>').join('')+
 '<div class="bar"><button class="btn red" onclick="modalSupply(\''+c.id+'\')">+ Steel Supplied (CR)</button><button class="btn green" onclick="modalPayment(\''+c.id+'\')">+ Payment Received (DR)</button><span class="sp"></span><button class="btn ghost" onclick="printStatement(\''+c.id+'\',\'\',\'\')">Statement</button><button class="btn ghost" onclick="exportCustomerCsv(\''+c.id+'\')">Export Excel/CSV</button><button class="btn ghost" onclick="modalCustomer(\''+c.id+'\')">Edit</button><button class="btn danger" onclick="delCustomer(\''+c.id+'\')">Delete</button></div>'+
 '<div class="card tw" style="padding:0"><table><thead><tr><th>Serial<span class="ur">نمبر</span></th><th>Date<span class="ur">تاریخ</span></th><th>Item Description<span class="ur">تفصیل</span></th><th>Net Qty (MT)<span class="ur">وزن</span></th><th>Size<span class="ur">سائز</span></th><th>Rate (PKR/MT)<span class="ur">ریٹ</span></th><th>Amount (PKR)<span class="ur">رقم</span></th><th>Bank Detail<span class="ur">بینک</span></th><th>Slip Date<span class="ur">سلپ</span></th><th>Cheque / Cash<span class="ur">چیک / نقد</span></th><th>Reference No<span class="ur">حوالہ</span></th><th>Credit (CR)<span class="ur">ادھار</span></th><th>Debit (DR)<span class="ur">وصولی</span></th><th>Time Period<span class="ur">مدت</span></th><th>Balance<span class="ur">بقایا</span></th><th></th></tr></thead><tbody>'+

function openModal(title,body,onSave,label){
 $('#modalRoot').innerHTML='<div class="ov" onmousedown="if(event.target===this)closeModal()"><div class="md"><h3>'+title+'</h3><form id="mf">'+body+'<div class="mfoot"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" type="submit">'+(label||'Save')+'</button></div></form></div></div>';
 const f=$('#mf');
 f.onsubmit=ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(f).entries());if(onSave(d,f)!==false)closeModal()};
 const first=f.querySelector('input:not([type=hidden]),select');if(first)first.focus();
 return f;
}

 });

const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};

/* ============ Credit ageing (oldest invoices are paid first) ============ */
function daysSince(iso){return Math.floor((new Date(today())-new Date(iso))/864e5)}
function ageing(cid){
 const c=cust(cid),es=entriesOf(cid);
 let pay=sum(es.filter(e=>e.type==='payment'),e=>e.amount);
 const op=num(c.opening),layers=[];
 if(op>0)layers.push({open:true,amt:op});else pay+=-op;
 es.filter(e=>e.type==='supply').forEach(e=>layers.push({date:e.date,amt:e.amount}));
 const r={b0:0,b1:0,b2:0,b3:0,open:0,total:0,overdue:0,adv:0},lim=num(c.days)||30;
 layers.forEach(l=>{
  const t=Math.min(l.amt,pay);l.rem=l.amt-t;pay-=t;
  if(l.rem<=0)return;
  r.total+=l.rem;
  if(l.open){r.open+=l.rem;r.overdue+=l.rem;return}
  const a=daysSince(l.date);
  r[a<=30?'b0':a<=60?'b1':a<=90?'b2':'b3']+=l.rem;
  if(a>lim)r.overdue+=l.rem;
 });
 r.adv=pay;return r;
}
function ageingAll(){const t={b0:0,b1:0,b2:0,b3:0,open:0,total:0,overdue:0};DB.customers.forEach(c=>{const a=ageing(c.id);Object.keys(t).forEach(k=>t[k]+=a[k])});return t}

/* ============ Stock, heat numbers, margin ============ */
function stockInfo(grade){
 const g=String(grade).trim().toLowerCase();
 const P=DB.purchases.filter(p=>p.grade.toLowerCase()===g),S=DB.entries.filter(e=>e.type==='supply'&&String(e.grade).toLowerCase()===g);
 const inn=sum(P,p=>p.qty),out=sum(S,e=>e.qty);
 return {tracked:P.length>0,inn:inn,out:out,stock:inn-out,cost:inn?sum(P,p=>p.qty*p.rate)/inn:null,sold:out?sum(S,e=>e.amount)/out:null};
}
function profit(ym){
 let p=0,known=false;
 DB.entries.filter(e=>e.type==='supply'&&(!ym||(e.date||'').startsWith(ym))).forEach(e=>{const s=stockInfo(e.grade);if(s.cost!=null){known=true;p+=e.amount-e.qty*s.cost}});
 return {p:p,known:known};
}
function ensureGrade(g,date,rate){
 if(!DB.grades.some(x=>x.toLowerCase()===g.toLowerCase()))DB.grades.push(g);
 if(rate&&!DB.rates.some(r=>r.grade.toLowerCase()===g.toLowerCase()))DB.rates.push({grade:g,from:date,rate:rate});
}

let ME=null;const DEF=['dashboard','customers','rates','quotes','stock','billing'],DEFE=['customers','rates','quotes','stock'];const isAdmin=()=>!!ME&&ME.role==='admin';const can=v=>!!ME&&(ME.role==='admin'||(ME.perm||DEF).includes(v));const canEdit=v=>!!ME&&can(v)&&(ME.role==='admin'||(ME.edit||DEFE).includes(v));const isOwner=()=>!!ME&&!!AUTH&&ME.u===AUTH.users[0].u;
async function H(p,salt){
 if(window.crypto&&crypto.subtle){const te=new TextEncoder(),k=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode(salt),iterations:100000,hash:'SHA-256'},k,256);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
 let h=5381;for(const c of salt+'|'+p)h=(h*33^c.charCodeAt(0))>>>0;return 'f'+h}
const rnd=n=>Array.from(crypto.getRandomValues(new Uint8Array(n))).map(x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join('');
const hist=m=>{if(!AUTH)return;AUTH.hist=AUTH.hist||[];AUTH.hist.unshift({t:new Date().toISOString(),m:m});AUTH.hist.length=Math.min(AUTH.hist.length,60);saveA()};

 else b='<h2>Sign in</h2><form onsubmit="doLogin(this);return false"><label>Username<input name="u" autocomplete="username" required></label><label>Password<input name="p" type="password" autocomplete="current-password" required></label><div id="gerr" class="gerr"></div><button class="btn">Sign in</button></form><a href="#" onclick="gate(\'rec\');return false">Forgot password?</a>';
 g.innerHTML='<div class="gc"><div class="gl">'+esc(DB.settings.name)+'</div>'+b+'<div class="hint" style="margin-top:10px;text-align:center">Version '+APPV+'</div></div>';

let fails=0,until=0;
async function doLogin(f){
 const e=$('#gerr');if(Date.now()<until){e.textContent='Too many attempts. Wait '+Math.ceil((until-Date.now())/1000)+' seconds.';return}

 if(u&&u.on&&await H(f.elements['p'].value,u.s)===u.h){fails=0;enter(u);return}

async function sendCode(f){
 const e=$('#gerr'),q=f.elements['u'].value.trim().toLowerCase(),u=AUTH.users.find(x=>x.u===q||(x.email&&x.email===q));
 if(!AUTH.mail||!AUTH.mail.sid){e.textContent='Email recovery is not set up yet. Ask the admin.';return}
 if(!u||!u.on||!u.email){e.textContent='No active account with an email matches that.';return}
 if(AUTH.rc&&Date.now()-AUTH.rc.at<6e4){e.textContent='Wait a minute before asking for another code.';return}
 const code=String(crypto.getRandomValues(new Uint32Array(1))[0]%1e6).padStart(6,'0'),sl=rnd(8);
 AUTH.rc={u:u.u,s:sl,h:await H(code,sl),exp:Date.now()+6e5,at:Date.now(),tries:0};saveA();e.textContent='Sending...';
 try{await mailer(u.email,{to_name:u.name,code:code});hist('Recovery code emailed for "'+u.u+'"');gate({verify:mask(u.email)})}
 catch(x){e.textContent='Could not send the email: '+x.message}
}
async function verifyCode(f){
 const e=$('#gerr'),r=AUTH.rc;if(!r||Date.now()>r.exp||r.tries>=5){e.textContent='That code has expired. Ask for a new one.';return}
 r.tries++;saveA();if(await H(f.elements['c'].value.trim(),r.s)!==r.h){e.textContent='Wrong code.';return}
 const u=AUTH.users.find(x=>x.u===r.u);u.s=rnd(8);u.h=await H(f.elements['p'].value,u.s);AUTH.rc=null;hist('Password reset by email for "'+u.u+'"');saveA();enter(u);
}

 '<div class="card"><h2>Data</h2><div class="bar"><button class="btn" onclick="nav(\'settings\')">Business details and backup</button><button class="btn ghost" onclick="backup()">Download backup</button><button class="btn ghost" onclick="exportAllCsv()">Export all entries</button></div></div>'+
 '<p class="hint" style="text-align:center">Steel Ledger Pro version '+APPV+'</p><div class="card"><h2>Sign-in history</h2><div class="tw" style="max-height:260px;overflow:auto"><table><thead><tr><th>When</th><th>Event</th></tr></thead><tbody>'+((AUTH.hist||[]).map(h=>'<tr><td>'+esc(new Date(h.t).toLocaleString())+'</td><td>'+esc(h.m)+'</td></tr>').join('')||'<tr><td colspan="2" class="c">No events yet</td></tr>')+'</tbody></table></div></div>';
}
async function addUser(f){
 const u=f.elements['u'].value.trim().toLowerCase();if(AUTH.users.some(x=>x.u===u)){toast('That username is taken');return}
 const s=rnd(8);AUTH.users.push({u:u,name:f.elements['n'].value.trim(),email:f.elements['e'].value.trim().toLowerCase(),role:f.elements['r'].value,perm:DEF.slice(),on:1,s:s,h:await H(f.elements['p'].value,s)});hist('Admin added user "'+u+'"');saveA();render();toast('User added');
}
async function resetPw(i){if(!i&&!isOwner()){toast('Only the main admin can change this password');return}const p=prompt('New password for '+AUTH.users[i].name+' (8+ characters):');if(!p)return;if(p.length<8){toast('Use at least 8 characters');return}
 const u=AUTH.users[i];u.s=rnd(8);u.h=await H(p,u.s);hist('Password changed for "'+u.u+'"');saveA();toast('Password updated')}
function setPerm(i,k,kind,on){
 const u=AUTH.users[i],P=(u.perm||DEF).slice(),E=(u.edit||DEFE).slice(),add=(a,x)=>{if(a.indexOf(x)<0)a.push(x)},del=(a,x)=>{const j=a.indexOf(x);if(j>=0)a.splice(j,1)};
 if(kind==='see'){on?add(P,k):(del(P,k),del(E,k))}else{on?(add(E,k),add(P,k)):del(E,k)}
 u.perm=P;u.edit=E;hist('Access for "'+u.u+'": '+k+' '+kind+' '+(on?'on':'off'));saveA();render();toast('Access updated');
}
function toggleU(i){const u=AUTH.users[i];u.on=u.on?0:1;hist((u.on?'Enabled ':'Disabled ')+'user "'+u.u+'"');saveA();render()}
function delU(i){const u=AUTH.users[i];if(!confirm('Delete user '+u.name+'?'))return;AUTH.users.splice(i,1);hist('Deleted user "'+u.u+'"');saveA();render()}
function setLock(v){AUTH.lock=+v;saveA();idle();toast('Auto-lock updated')}
function saveMail(f){const E=f.elements;AUTH.mail={sid:E['s'].value.trim(),tid:E['t'].value.trim(),key:E['k'].value.trim()};saveA();render();toast('Email settings saved')}
async function testMail(){if(!ME.email){toast('Add your email first (Set email)');return}if(!AUTH.mail||!AUTH.mail.sid){toast('Save the email settings first');return}try{await mailer(ME.email,{to_name:ME.name,code:'123456'});toast('Test email sent to '+ME.email)}catch(x){toast('Failed: '+x.message)}}
function setEmail(i){if(!i&&!isOwner()){toast('Only the main admin can change this email');return}const u=AUTH.users[i],v=prompt('Email for '+u.name+':',u.email||'');if(v==null)return;if(!/^\S+@\S+\.\S+$/.test(v.trim())){toast('That is not a valid email');return}u.email=v.trim().toLowerCase();hist('Email set for "'+u.u+'"');saveA();render();toast('Email saved')}
const GUARD={customers:['modalCustomer','delCustomer','modalSupply','modalPayment','delEntry'],quotes:['modalQuote','delQuote','convertQuote'],stock:['modalPurchase','delPurchase','setMin'],rates:['addGrade','delGrade','addRate','delRate'],settings:['saveSettings','restore','resetAll']};
const secOf=()=>view.name==='customer'?'customers':view.name;
for(const k in GUARD)GUARD[k].forEach(n=>{const o=window[n];if(typeof o!=='function')return;window[n]=function(){if(!canEdit(k)){toast('You have view-only access to this section');return}return o.apply(this,arguments)}});
{const _r=render;render=function(){_r();const k=secOf();if(!ME||canEdit(k)||!GUARD[k])return;
 const m=$('#main');GUARD[k].forEach(n=>m.querySelectorAll('[onclick*="'+n+'("],[onchange*="'+n+'("],[onsubmit*="'+n+'("]').forEach(el=>{el.style.display='none'}));
 if(k==='settings')m.querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);
 m.insertAdjacentHTML('afterbegin','<div class="banner y" style="margin-bottom:10px">View only. Ask the admin if you need to make changes here.</div>')}}
const APPV='2.3';
function syncAuth(raw){
 try{AUTH=JSON.parse(raw!==undefined?raw:localStorage.getItem(AK))}catch(x){return}
 if(!AUTH){ME=null;gate();return}
 applyTheme();if(!ME)return;
 const u=AUTH.users.find(x=>x.u===ME.u);if(!u||!u.on){logout();return}
 ME=u;render();
}
addEventListener('storage',e=>{
 if(e.key===AK)syncAuth(e.newValue);
 else if(e.key===KEY&&ME){DB=load();render()}
});
addEventListener('focus',()=>{if(ME){syncAuth();try{DB=load()}catch(x){}render()}});
applyTheme();
{const su=sessionStorage.getItem('sl_u'),u=AUTH&&AUTH.users.find(x=>x.u===su&&x.on);if(u)enter(u,true);else gate()}
</script>
